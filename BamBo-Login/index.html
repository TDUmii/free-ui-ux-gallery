<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bamboo Login - giao diện đăng nhập tương tác phong cách truyện tranh giấy cổ.">
  <meta name="author" content="TDUmii">
  <meta name="theme-color" content="#eee0bd">
  <meta property="og:title" content="Bamboo - Đăng nhập">
  <meta property="og:description" content="Một mẫu login miễn phí, vui nhộn với gấu trúc và đèn kéo dây.">
  <meta property="og:type" content="website">
  <title>Bamboo - Đăng nhập</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/panda.svg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/lamp.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/panda.css">
  <link rel="stylesheet" href="css/form.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<main class="scene">
    <section class="lamp-zone" aria-label="Đèn ngủ Bamboo">
      <div class="lamp">
        <span class="lamp-aura"></span>
        <span class="shade">
          <span class="lamp-face">
            <span class="lamp-eye left"></span>
            <span class="lamp-eye right"></span>
            <span class="lamp-cheek left"></span>
            <span class="lamp-cheek right"></span>
            <span class="lamp-mouth"></span>
          </span>
        </span>
        <span class="lamp-zzz" aria-hidden="true"><span>Z</span><span>z</span><span>z</span></span>
        <span class="stem"></span>
        <span class="base"></span>
        <button class="lamp-switch" id="lampSwitch" type="button" aria-label="Bật hoặc tắt đèn" aria-pressed="true">
          <span class="cord" aria-hidden="true"></span>
          <span class="cord-handle" aria-hidden="true"></span>
        </button>
      </div>
      <p class="lamp-hint">Kéo dây để tắt đèn</p>
    </section>

    <section class="login-zone" aria-labelledby="loginTitle">
      <div class="panda" id="panda" aria-hidden="true">
        <span class="panda-ear left"></span>
        <span class="panda-ear right"></span>
        <span class="leaf"></span>
        <span class="panda-body"></span>
        <div class="panda-head">
          <span class="eye-patch left"><span class="eye"><span class="pupil"></span></span></span>
          <span class="eye-patch right"><span class="eye"><span class="pupil"></span></span></span>
          <span class="blush left"></span>
          <span class="blush right"></span>
          <span class="panda-nose"></span>
          <span class="panda-mouth"></span>
        </div>
        <span class="paw left"></span>
        <span class="paw right"></span>
        <span class="panda-greeting" aria-hidden="true">Hiii!</span>
      </div>

      <form class="login-card" id="loginForm" novalidate>
        <h1 class="brand" id="loginTitle">Bamboo</h1>
        <p class="subtitle">Mừng bạn trở lại. Panda vẫn luôn đợi bạn.</p>

        <div class="field">
          <label for="username">Tên đăng nhập</label>
          <div class="input-wrap">
            <input id="username" name="username" type="text" required maxlength="64" placeholder="Nhập tên của bạn" autocomplete="username" aria-describedby="usernameError">
            <span class="input-icon" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"></circle><path d="M5.5 19c.8-3.6 3-5.4 6.5-5.4s5.7 1.8 6.5 5.4"></path></svg>
            </span>
          </div>
          <p class="error-message" id="usernameError" role="alert">Bạn chưa nhập tên đăng nhập.</p>
        </div>

        <div class="field">
          <label for="password">Mật khẩu</label>
          <div class="input-wrap">
            <input id="password" name="password" type="password" required minlength="6" maxlength="128" placeholder="Ít nhất 6 ký tự" autocomplete="current-password" aria-describedby="passwordError">
            <button class="password-toggle" id="passwordToggle" type="button" aria-label="Hiện mật khẩu" aria-pressed="false">
              <svg class="icon eye-open" viewBox="0 0 24 24"><path d="M2.8 12s3.3-5 9.2-5 9.2 5 9.2 5-3.3 5-9.2 5-9.2-5-9.2-5Z"></path><circle cx="12" cy="12" r="2.3"></circle></svg>
            </button>
          </div>
          <p class="error-message" id="passwordError" role="alert">Mật khẩu cần có ít nhất 6 ký tự.</p>
        </div>

        <div class="options">
          <label class="remember">
            <input type="checkbox" name="remember">
            <span class="checkmark" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="m6 12.5 3.7 3.7L18 7.8"></path></svg></span>
            <span>Ghi nhớ tôi</span>
          </label>
          <a href="#" data-demo="Mình sẽ gửi liên kết đặt lại mật khẩu cho bạn.">Quên mật khẩu?</a>
        </div>

        <button class="sign-in" id="signInButton" type="submit">
          <span>Đăng nhập</span>
          <span class="arrow-box" aria-hidden="true">
            <svg class="icon arrow-icon" viewBox="0 0 24 24"><path d="M5 12h13M14 7l5 5-5 5"></path></svg>
            <span class="spinner"></span>
          </span>
        </button>

        <div class="divider"><span>hoặc tiếp tục với</span></div>

        <div class="socials">
          <button class="social-button" type="button" data-provider="Google">
            <svg class="social-logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.4a4.6 4.6 0 0 1-2 3v2.5h3.3c1.9-1.8 2.9-4.4 2.9-7.4Z"></path><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.7-2.4l-3.3-2.5c-.9.6-2.1 1-3.4 1-2.6 0-4.8-1.8-5.6-4.2H3v2.6A10 10 0 0 0 12 22Z"></path><path fill="#FBBC05" d="M6.4 13.9a6 6 0 0 1 0-3.8V7.5H3A10 10 0 0 0 3 16.5l3.4-2.6Z"></path><path fill="#EA4335" d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.9-2.8A9.7 9.7 0 0 0 3 7.5l3.4 2.6C7.2 7.7 9.4 5.9 12 5.9Z"></path></svg>
            <span>Google</span>
          </button>
          <button class="social-button" type="button" data-provider="Apple">
            <svg class="social-logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.7 12.7c0-2.4 2-3.6 2.1-3.7a4.5 4.5 0 0 0-3.5-1.9c-1.5-.2-2.9.9-3.6.9s-1.8-.9-3-.9a4.7 4.7 0 0 0-4 2.4c-1.7 2.9-.4 7.2 1.2 9.5.8 1.1 1.7 2.3 3 2.2 1.2 0 1.6-.7 3.1-.7s1.9.7 3.1.7c1.3 0 2.1-1.1 2.9-2.2a10 10 0 0 0 1.3-2.7 4.1 4.1 0 0 1-2.6-3.6ZM14.3 5.5A4.2 4.2 0 0 0 15.3 2a4.3 4.3 0 0 0-3 1.7 4 4 0 0 0-1 3.3 3.6 3.6 0 0 0 3-1.5Z"></path></svg>
            <span>Apple</span>
          </button>
        </div>

        <p class="new-account">Chưa có tài khoản? <a href="#" data-demo="Tính năng tạo tài khoản đang được chuẩn bị.">Tạo tài khoản</a></p>
      </form>
      <button class="form-lock" id="formLock" type="button" aria-hidden="true" tabindex="-1">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
        <strong>Bật đèn lên đã nhé!</strong>
        <span>Kéo dây bên chiếc đèn rồi mình đăng nhập tiếp.</span>
      </button>
    </section>
  </main>

  <footer class="site-credit">© 2026 TDUmii - Free UI/UX.</footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="js/core.js" defer></script>
  <script src="js/toast.js" defer></script>
  <script src="js/panda.js" defer></script>
  <script src="js/form.js" defer></script>
  <script src="js/lamp.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
