<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="author" content="TDUmii">
  <title>404 - Page Not Found | Cow Error Page</title>
  <meta name="description" content="404 Error Page - Sorry, Page Not Found! Hoạt cảnh chú bò đi ngang qua màn hình và ngã vào hố vui nhộn">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <!-- Google Fonts: Fredoka & Permanent Marker & Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&family=Permanent+Marker&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Preloaded Audio Elements for Instant Playback -->
  <div id="audioContainer" style="display:none;" aria-hidden="true">
    <audio id="sndAppear" preload="auto">
      <source src="assets/audio/moo_appear.mp3" type="audio/mpeg">
      <source src="assets/audio/moo_appear.wav" type="audio/wav">
    </audio>
    <audio id="sndFall" preload="auto">
      <source src="assets/audio/moo_fall.mp3" type="audio/mpeg">
      <source src="assets/audio/moo_fall.wav" type="audio/wav">
    </audio>
    <audio id="sndClick" preload="auto">
      <source src="assets/audio/moo_click.mp3" type="audio/mpeg">
      <source src="assets/audio/moo_click.wav" type="audio/wav">
    </audio>
  </div>
  <!-- Skip to content link for accessibility -->
  <a href="#btnHome" class="sr-only">Chuyển đến nút trang chủ</a>

  <!-- Scene Container -->
  <main class="scene-wrapper" id="sceneWrapper">
    <div class="scene-container" id="sceneContainer">
      
      <!-- Left Column: Error Typography & Button -->
      <section class="error-info" aria-label="Nội dung thông báo lỗi">
        <!-- 404 Code (Large chalk display) -->
        <div class="error-code-wrapper">
          <h1 class="error-code" aria-label="Error 404">
            <span class="digit d-4">4</span>
            <span class="digit d-0">0</span>
            <span class="digit d-4-second">4</span>
          </h1>
        </div>

        <!-- Subtitle message -->
        <p class="error-message">
          <span>Sorry,</span>
          <span>Page Not Found!</span>
        </p>

        <!-- Button Destination Target Area -->
        <div class="button-target-area" id="buttonTargetArea">
          <!-- The Flying / Interactive Go Home Button -->
          <a href="#" class="btn-home" id="btnHome" role="button" aria-label="Quay về trang chủ">
            Go Home
          </a>
        </div>
      </section>

      <!-- Right Column: Interactive Stage & Cow Animation -->
      <section class="stage-section" aria-label="Hoạt cảnh tương tác">
        <div class="stage-canvas" id="stageCanvas">
          
          <!-- Ground Black Hole -->
          <div class="hole" id="hole" aria-hidden="true"></div>

          <!-- Ground Clipping Container: clips submerged body parts at the hole line -->
          <div class="cow-ground-container" id="cowGroundContainer">
            <!-- Phase 1 & 2: Walking & Diving Cow (Walks to hole rim and plunges in) -->
            <div class="cow cow-walking" id="cowWalking" aria-label="Chú bò đang đi bộ và ngã vào hố">
              <svg class="cow-svg" viewBox="0 0 250 170" width="250" height="170" xmlns="http://www.w3.org/2000/svg">
                <!-- Tail (anchored at 38, 42) -->
                <g transform="translate(38, 42)">
                  <g class="tail-anim">
                    <path d="M 0 0 C -18 8, -22 35, -21 55 C -22 62, -21 65, -21 68" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round"/>
                    <ellipse cx="-21" cy="71" rx="6" ry="8" fill="#000000"/>
                  </g>
                </g>

                <!-- Back Legs -->
                <g transform="translate(34, 85)">
                  <g class="leg-back-inner">
                    <path d="M 0 0 L -2 40" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round"/>
                    <path d="M -2 32 L -3 41" stroke="#000000" stroke-width="7.5" stroke-linecap="round"/>
                  </g>
                </g>
                <g transform="translate(48, 85)">
                  <g class="leg-back-outer">
                    <path d="M 0 0 L 1 39" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round"/>
                    <path d="M 1 31 L 1 40" stroke="#000000" stroke-width="7.5" stroke-linecap="round"/>
                  </g>
                </g>

                <!-- Cow Body -->
                <g class="body-group">
                  <!-- White base -->
                  <rect x="25" y="30" width="138" height="66" rx="14" ry="14" fill="#ffffff"/>

                  <!-- Organic Top Black Patch -->
                  <path d="M 25 44 
                           C 25 33, 33 30, 44 30 
                           L 155 30 
                           C 160 30, 163 33, 163 42 
                           C 152 46, 140 40, 126 44 
                           C 112 48, 105 38, 92 48 
                           C 80 56, 68 34, 46 34 
                           C 32 34, 25 48, 25 44 Z" fill="#000000"/>
                  
                  <path d="M 25 36 C 25 30, 32 30, 38 30 C 45 30, 48 48, 38 60 C 28 64, 25 55, 25 36 Z" fill="#000000"/>

                  <!-- Spots -->
                  <circle cx="58" cy="74" r="14" fill="#000000"/>
                  <circle cx="98" cy="55" r="9" fill="#000000"/>
                </g>

                <!-- Front Legs -->
                <g transform="translate(142, 85)">
                  <g class="leg-front-inner">
                    <path d="M 0 0 L -2 40" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round"/>
                    <path d="M -2 32 L -3 41" stroke="#000000" stroke-width="7.5" stroke-linecap="round"/>
                  </g>
                </g>
                <g transform="translate(154, 85)">
                  <g class="leg-front-outer">
                    <path d="M 0 0 L 1 39" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round"/>
                    <path d="M 1 31 L 1 40" stroke="#000000" stroke-width="7.5" stroke-linecap="round"/>
                  </g>
                </g>

                <!-- Cow Head & Neck -->
                <g class="head-wrapper" transform="translate(148, 24)">
                  <g class="head-anim">
                    <!-- Smooth black neck bridge into head -->
                    <path d="M 0 8 C 8 0, 15 -2, 24 0 C 30 5, 28 20, 16 20 Z" fill="#000000"/>

                    <!-- Ear (tilted back along neck) -->
                    <g transform="translate(12, -2) rotate(-35)">
                      <!-- Back horn / ear fold with small tip -->
                      <path d="M 3 -2 C 6 -8, 12 -7, 13 -1 Z" fill="#000000" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
                      <!-- Main front ear: pointed leaf/oval -->
                      <path d="M -14 0 C -12 -6, -2 -8, 10 -4 C 15 -1, 14 5, 8 7 C 0 9, -11 6, -14 0 Z" fill="#000000"/>
                      <!-- White top rim -->
                      <path d="M -14 0 C -12 -6, -2 -8, 10 -4" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
                    </g>

                    <!-- Head: Tilted capsule 40deg -->
                    <g transform="translate(11, -2) rotate(40)">
                      <defs>
                        <clipPath id="hClipWalk">
                          <rect x="0" y="0" width="60" height="28" rx="14" ry="14"/>
                        </clipPath>
                      </defs>
                      <!-- Solid Black Head -->
                      <rect x="0" y="0" width="60" height="28" rx="14" ry="14" fill="#000000"/>
                      <!-- White Forehead Dome -->
                      <g clip-path="url(#hClipWalk)">
                        <ellipse cx="28" cy="2" rx="28" ry="11" fill="#ffffff"/>
                      </g>
                    </g>
                  </g>
                </g>
              </svg>
            </div>
          </div>

          <!-- Backwards-compatibility hidden placeholder for #cowDiving -->
          <div class="cow cow-diving" id="cowDiving" style="display:none;" aria-hidden="true"></div>

          <!-- Phase 3: Stuck Cow in Hole (idle wiggling tail and kicking legs) -->
          <div class="cow cow-stuck" id="cowStuck" title="Click me! (Bấm vào chú bò để tương tác)" role="button" tabindex="0" aria-label="Chú bò đang bị mắc kẹt trong hố">
            <svg class="cow-svg-stuck" viewBox="0 0 180 140" width="180" height="140" xmlns="http://www.w3.org/2000/svg">
              <!-- Cow Upper Body Sticking Out of Hole -->
              <g class="stuck-body-group">
                <!-- White backside -->
                <path class="stuck-torso" d="M 58 116 L 58 52 C 58 36, 72 32, 88 32 C 108 32, 122 36, 122 52 L 122 116 Z" fill="#ffffff"/>
                
                <!-- Big right black patch -->
                <path class="stuck-black-patch" d="M 84 116 C 84 76, 92 56, 122 56 L 122 116 Z" fill="#000000"/>
                
                <!-- Big bottom-left circular spot -->
                <circle class="stuck-spot-large" cx="69" cy="94" r="14" fill="#000000"/>

                <!-- Tail arched over the top -->
                <g class="stuck-tail-anim">
                  <path d="M 112 38 C 98 25, 78 26, 68 31" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
                  <ellipse class="stuck-tail-tip" cx="65" cy="32" rx="5.5" ry="4.5" fill="#000000"/>
                </g>

                <!-- Two legs sticking out horizontally to the left -->
                <g class="stuck-kicking-legs">
                  <!-- Top Leg -->
                  <g class="kicking-leg leg-upper">
                    <path d="M 58 58 C 45 56, 32 50, 24 53" stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none"/>
                    <path d="M 28 52 L 23 54" stroke="#000000" stroke-width="7" stroke-linecap="round" fill="none"/>
                  </g>

                  <!-- Bottom Leg -->
                  <g class="kicking-leg leg-lower">
                    <path d="M 58 72 C 46 72, 34 68, 26 71" stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none"/>
                    <path d="M 30 70 L 25 72" stroke="#000000" stroke-width="7" stroke-linecap="round" fill="none"/>
                  </g>
                </g>
              </g>

              <!-- Floating interactive reaction badge -->
              <g class="click-reaction" id="clickReaction" opacity="0">
                <path d="M 130 35 C 130 25, 140 20, 140 20 C 140 20, 150 25, 150 35 C 150 42, 140 46, 140 46 C 140 46, 130 42, 130 35 Z" fill="#60a5fa"/>
              </g>
            </svg>
          </div>

        </div>
      </section>

    </div>

    <!-- Floating Top-Bar Controls -->
    <header class="app-header" aria-label="Điều khiển hoạt cảnh">
      <div class="header-left">
        <span class="badge-status">HTTP 404</span>
      </div>
      <div class="header-actions">
        <!-- Replay Button -->
        <button class="btn-ctrl" id="btnReplay" type="button" title="Replay Animation (Phát lại hoạt cảnh - Phím tắt: R)">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
          <span>Replay</span>
        </button>

        <!-- Sound Toggle Button -->
        <button class="btn-ctrl" id="btnSound" type="button" title="Toggle Sound (Bật/Tắt âm thanh hiệu ứng - Phím tắt: M)">
          <!-- Sound Off Icon -->
          <svg class="icon-sound-off" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
            <path d="M11 5L6 9H2v6h4l5 4V5z"/>
            <line x1="23" y1="9" x2="17" y2="15"/>
            <line x1="17" y1="9" x2="23" y2="15"/>
          </svg>
          <!-- Sound On Icon -->
          <svg class="icon-sound-on" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 5L6 9H2v6h4l5 4V5z"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
          <span id="soundText">Sound On</span>
        </button>
      </div>
    </header>

    <!-- Toast Notification for Interactions -->
    <div class="toast-message" id="toastMessage" role="status" aria-live="polite"></div>

    <footer class="site-credit">
      <a href="https://github.com/TDUmii/free-ui-ux-gallery">TDUmii <span>- Free UI/UX</span></a>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
