<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b8b" />
      <stop offset="100%" stop-color="#ff3366" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="rgba(255, 51, 102, 0.4)" />
    </filter>
  </defs>

  <!-- Dark Circular Background Badge -->
  <circle cx="32" cy="32" r="30" fill="#180b15" stroke="rgba(255, 107, 139, 0.4)" stroke-width="2" />

  <!-- Glowing Heart -->
  <path d="M 32 48 C 32 48 14 36 14 24 C 14 17.5 19.5 12 26 12 C 29.5 12 32 14.5 32 14.5 C 32 14.5 34.5 12 38 12 C 44.5 12 50 17.5 50 24 C 50 36 32 48 32 48 Z"
        fill="url(#heartGrad)" filter="url(#shadow)" />

  <!-- Little Sparkle -->
  <circle cx="23" cy="20" r="2.5" fill="#ffffff" opacity="0.8" />
  <circle cx="41" cy="22" r="1.5" fill="#ffffff" opacity="0.6" />
</svg>
