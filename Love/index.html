<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="author" content="TDUmii">
  <title>Thư Tình Valentine ❤️</title>
  <meta name="description" content="Thư Tình Valentine lãng mạn - Bắn cung Cupid, mèo pixel ôm tim đáng yêu, bức thư kỷ niệm tình yêu.">

  <!-- Google Fonts: Baloo 2 (Cực đẹp chuẩn Tiếng Việt), Comfortaa, Quicksand & Silkscreen (English 8-bit) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Comfortaa:wght@600;700&family=Quicksand:wght@500;600;700&family=Silkscreen:wght@400;700&subset=vietnamese&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body class="lang-vi">
  <!-- Ambient floating background hearts -->
  <div class="ambient-bg" id="ambientBg" aria-hidden="true"></div>

  <!-- Fullscreen Celebration Canvas (Heart Rain) -->
  <canvas class="celebration-canvas" id="celebrationCanvas"></canvas>

  <!-- Website Container -->
  <div class="site-container">
    
    <!-- Top Minimal Navigation -->
    <header class="site-nav">
      <div class="nav-brand">
        <span class="nav-heart">💌</span>
        <span class="nav-title" id="navTitleText">Thư Tình</span>
      </div>
      <div class="nav-actions">
        <!-- Nút chuyển đổi ngôn ngữ Việt / Anh ở góc -->
        <button class="nav-btn nav-btn-lang" id="btnLang" title="Đổi ngôn ngữ / Switch Language (L)" aria-label="Đổi ngôn ngữ">
          <span id="langFlag">🌐</span>
          <span class="lang-code" id="langText">VI</span>
        </button>
        <button class="nav-btn" id="btnSound" title="Bật / Tắt âm thanh (M)" aria-label="Bật tắt âm thanh">
          <span id="soundIcon">🔊</span>
          <span class="btn-text" id="soundText">Âm thanh</span>
        </button>
        <button class="nav-btn" id="btnReplay" title="Chơi lại từ đầu (R)" aria-label="Chơi lại từ đầu">
          <span>↺</span>
          <span class="btn-text" id="replayText">Chơi lại</span>
        </button>
      </div>
    </header>

    <!-- Main Interactive Stage Card -->
    <main class="interactive-card" id="interactiveCard">
      
      <!-- ================= STAGE 1: CUPID'S BOW & ENVELOPE ================= -->
      <section class="stage stage-bow active" id="stageBow" aria-label="Giương cung bắn thư tình">
        
        <!-- The Envelope (Matching envelope_crop.png) -->
        <div class="envelope-container" id="envelopeContainer">
          <div class="envelope" id="envelope">
            <!-- SVG Envelope with exact folds and flap -->
            <svg class="envelope-svg" viewBox="0 0 240 150">
              <!-- Envelope Body & Border -->
              <rect x="3" y="3" width="234" height="144" rx="14" fill="#ffffff" stroke="#d97b73" stroke-width="5"/>
              <!-- Diagonal Creases -->
              <line x1="3" y1="62" x2="120" y2="147" stroke="#e895a0" stroke-width="3.5" stroke-linecap="round"/>
              <line x1="237" y1="62" x2="120" y2="147" stroke="#e895a0" stroke-width="3.5" stroke-linecap="round"/>
              <!-- Top Pink Flap -->
              <polygon id="envelopeFlapPoly" points="3,3 237,3 120,84" fill="#f7a8b8" stroke="#d97b73" stroke-width="4.5" stroke-linejoin="round"/>
            </svg>
            
            <!-- Heart Wax Seal -->
            <div class="heart-seal" id="heartSeal">
              <svg viewBox="0 0 32 32" class="seal-svg">
                <path d="M16 28 C16 28 3 20 3 10 C3 5 7 2 12 2 C14.5 2 16 3.5 16 4.5 C16 3.5 17.5 2 20 2 C25 2 29 5 29 10 C29 20 16 28 16 28 Z" fill="#e23b4e"/>
              </svg>
            </div>
          </div>

          <!-- Pixel Milestone Text -->
          <div class="milestone-text">
            <span class="pixel-heart">❤️</span>
            <span class="milestone-title" id="milestoneTitle">Chúc mừng 1 tháng</span>
            <span class="pixel-heart">❤️</span>
          </div>
        </div>

        <!-- Cupid's Bow & Arrow (Matching bow_crop.png) -->
        <div class="cupid-station" id="cupidStation">
          <div class="bow-wrapper" id="bowWrapper">
            
            <!-- Authentic Upward-Arched Bow SVG (Arch pointing UP towards envelope, string below) -->
            <svg class="bow-svg" id="bowSvg" viewBox="0 0 240 100">
              <!-- Cute little pink heart on left tip -->
              <path d="M 28 62 C 28 62, 22 56, 22 52 C 22 49, 24 47, 26.5 47 C 28 47, 28 48.5, 28 48.5 C 28 48.5, 28 47, 29.5 47 C 32 47, 34 49, 34 52 C 34 56, 28 62, 28 62 Z" fill="#f7a8b8"/>

              <!-- Wooden Bow Limbs (Curves UPWARDS in a proud arch pointing towards envelope) -->
              <path d="M 30 65 C 36 42, 50 30, 95 28 L 145 28 C 190 30, 204 42, 210 65" fill="none" stroke="#ba7536" stroke-width="13" stroke-linecap="round"/>
              <path d="M 30 65 C 36 42, 50 30, 95 28 L 145 28 C 190 30, 204 42, 210 65" fill="none" stroke="#e09d57" stroke-width="6" stroke-linecap="round"/>

              <!-- Bow Grip (Darker brown rounded rectangle in the center top of the arch) -->
              <rect x="98" y="20" width="44" height="16" rx="5" fill="#6d3511"/>

              <!-- Bowstring (Connects left tip and right tip across the bottom) -->
              <path id="bowStringPath" d="M 30 65 Q 120 65 210 65" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
            </svg>

            <!-- Cupid Arrow (Straight shaft, red triangle head, pink heart nock) -->
            <div class="arrow" id="cupidArrow">
              <!-- Arrowhead: Red Triangle pointing UP towards the envelope -->
              <div class="arrow-tip">
                <svg viewBox="0 0 24 24" class="arrow-tip-svg">
                  <polygon points="12,2 3,22 21,22" fill="#e23b4e"/>
                </svg>
              </div>

              <!-- Wooden Shaft -->
              <div class="arrow-shaft"></div>

              <!-- Base Nock: Pink Heart resting on the string -->
              <div class="arrow-nock-heart">
                <svg viewBox="0 0 24 24" class="nock-heart-svg">
                  <!-- Heart resting with point touching string -->
                  <path d="M 12 21 C 12 21, 3 13, 3 7.5 C 3 4, 6 2, 9.5 2 C 11.5 2, 12 3.5, 12 3.5 C 12 3.5, 12.5 2, 14.5 2 C 18 2, 21 4, 21 7.5 C 21 13, 12 21, 12 21 Z" fill="#f7a8b8"/>
                </svg>
              </div>
            </div>

            <!-- Interactive Aim Handle (Pointer & Touch Area) -->
            <div class="aim-handle" id="aimHandle" role="slider" aria-label="Kéo xuống và thả để bắn mũi tên Cupid" tabindex="0">
              <div class="aim-cursor-hint">
                <svg viewBox="0 0 24 24" class="cursor-svg">
                  <path d="M7 2 L17 12 L12 13 L15 19 L12 20 L9 14 L5 17 Z" fill="#ffffff" stroke="#2b2326" stroke-width="1.8"/>
                </svg>
              </div>
            </div>

          </div>

          <!-- Instruction Text -->
          <p class="instruction-text" id="instructionText">
            Kéo và thả để bắn mũi tên tình yêu <span class="pixel-heart">❤️</span>
          </p>
        </div>

      </section>

      <!-- ================= STAGE 2: RETRO LOVE WINDOW & PIXEL CAT ================= -->
      <section class="stage stage-love-window" id="stageLoveWindow" aria-label="Cửa sổ thông điệp tình yêu">
        
        <!-- The Retro LOVE Window (Matching window_crop.png) -->
        <div class="love-window" id="loveWindow">
          
          <!-- Titlebar: LOVE and window buttons [ — ] [ ▫ ] [ ✕ ] -->
          <div class="window-titlebar">
            <span class="titlebar-text" id="windowTitleText">TÌNH YÊU</span>
            <div class="window-controls">
              <span class="win-btn">_</span>
              <span class="win-btn">▫</span>
              <span class="win-btn">✕</span>
            </div>
          </div>

          <!-- Heart Ribbon Bar: ❤️ • ❤️ • ❤️ -->
          <div class="heart-ribbon-bar">
            <span>❤️</span>
            <span class="ribbon-dot">•</span>
            <span>❤️</span>
            <span class="ribbon-dot">•</span>
            <span>❤️</span>
          </div>

          <!-- Window Interior with Gingham Checkered Plaid Pattern -->
          <div class="window-body" id="windowBody">
            
            <!-- The Romantic Question (Matching window_crop.png) -->
            <h2 class="love-question" id="loveQuestion">
              Kỷ niệm 1 tháng bên nhau ♡ Vẫn<br>yêu anh chứ?
            </h2>

            <!-- Exact Pixel Art Cat Canvas (15x14 Matrix) -->
            <div class="cat-wrapper" id="catWrapper">
              <canvas id="catCanvas" width="160" height="150" aria-label="Chú mèo đen pixel art ôm trái tim"></canvas>
            </div>

            <!-- YES and NO Buttons Playground -->
            <div class="buttons-area" id="buttonsArea">
              
              <!-- YES Button with Outer Dashed Box (Matching real_buttons_3.png) -->
              <div class="btn-yes-dashed" id="yesDashedWrapper">
                <button class="btn-pixel btn-yes" id="yesBtn" aria-label="Đồng ý">
                  CÓ ❤️
                </button>
              </div>

              <!-- NO Button (Playful dodge game) -->
              <div class="btn-no-wrapper" id="noWrapper">
                <button class="btn-pixel btn-no" id="noBtn" aria-label="Không">
                  KHÔNG
                </button>
              </div>

            </div>

            <!-- Typed Love Letter Container (Appears after YES) -->
            <div class="letter-box" id="letterBox" aria-live="polite">
              <p class="letter-text" id="letterText"></p>
              <div class="letter-action">
                <button class="btn-restart" id="btnRestart">
                  ↺ Chơi lại lần nữa
                </button>
              </div>
            </div>

          </div>

        </div>

      </section>

    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <p id="footerText">Được tạo với tất cả tình yêu 💖 Thư Tình Valentine</p>
      <a class="personal-credit" href="https://github.com/TDUmii/free-ui-ux-gallery">TDUmii <span>- Free UI/UX</span></a>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
